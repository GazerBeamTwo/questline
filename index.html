<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Questline</title>
  <meta name="description" content="A journal that levels you up: turn your bucket list into a skill tree, and every entry is proof you've grown.">
  <meta name="theme-color" content="#F4EFE6" id="meta-theme">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Questline">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('ql-theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"><div class="boot">Opening your journal…</div></main>
    <nav id="tabbar" aria-label="Main">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span></a>
      <a href="#/tree" data-tab="tree"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5 6.2 16.8M12 11.5l5.8 5.3"/></svg><span>Tree</span></a>
      <a href="#/entry/new" data-tab="new" class="tab-new" aria-label="New entry"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
      <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M9 8h6M9 12h4"/></svg><span>Journal</span></a>
      <a href="#/sheet" data-tab="sheet"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Character</span></a>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
